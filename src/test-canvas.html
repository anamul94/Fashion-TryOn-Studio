<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Test</title>
</head>
<body>
    <h1>Canvas Image Generation Test</h1>
    <div id="output"></div>
    
    <script>
        console.log('🧪 Testing canvas image generation...');
        
        function generateTestImage(type) {
            console.log(`🎨 Generating test image for type: ${type}`);
            
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 600;
                const ctx = canvas.getContext('2d');
                
                if (!ctx) {
                    console.error('❌ Failed to get canvas context');
                    return null;
                }
                
                console.log('✅ Canvas created successfully:', { width: canvas.width, height: canvas.height });
                
                // Background gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, 600);
                if (type === 'tryon') {
                    gradient.addColorStop(0, '#f3e8ff');
                    gradient.addColorStop(1, '#e0e7ff');
                } else {
                    gradient.addColorStop(0, '#fef3c7');
                    gradient.addColorStop(1, '#fde68a');
                }
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 400, 600);
                
                // Add text
                ctx.fillStyle = '#374151';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(type === 'tryon' ? 'AI Try-On Result' : 'AI Pose Result', 200, 280);
                
                ctx.font = '16px Arial';
                ctx.fillText('Professional Fashion AI', 200, 320);
                ctx.fillText('Ready for E-commerce', 200, 350);
                
                // Add timestamp
                ctx.font = '12px Arial';
                ctx.fillText(`Generated: ${new Date().toLocaleTimeString()}`, 200, 380);
                
                const imageUrl = canvas.toDataURL('image/png');
                console.log('✅ Test image generated successfully:', {
                    type,
                    imageUrlLength: imageUrl.length,
                    imageUrlPreview: imageUrl.substring(0, 50) + '...'
                });
                
                return {
                    imageUrl,
                    altText: `Test ${type} image`
                };
            } catch (error) {
                console.error('❌ Error generating test image:', error);
                return null;
            }
        }
        
        // Test both types
        const tryonResult = generateTestImage('tryon');
        const poseResult = generateTestImage('pose');
        
        // Display results
        const output = document.getElementById('output');
        
        if (tryonResult) {
            const img1 = document.createElement('img');
            img1.src = tryonResult.imageUrl;
            img1.alt = tryonResult.altText;
            img1.style.width = '200px';
            img1.style.margin = '10px';
            img1.style.border = '1px solid #ccc';
            output.appendChild(img1);
            
            const p1 = document.createElement('p');
            p1.textContent = 'Try-on test image generated successfully!';
            p1.style.color = 'green';
            output.appendChild(p1);
        }
        
        if (poseResult) {
            const img2 = document.createElement('img');
            img2.src = poseResult.imageUrl;
            img2.alt = poseResult.altText;
            img2.style.width = '200px';
            img2.style.margin = '10px';
            img2.style.border = '1px solid #ccc';
            output.appendChild(img2);
            
            const p2 = document.createElement('p');
            p2.textContent = 'Pose test image generated successfully!';
            p2.style.color = 'green';
            output.appendChild(p2);
        }
        
        console.log('🧪 Canvas test completed');
    </script>
</body>
</html>
